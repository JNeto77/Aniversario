<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para o meu grande amor ❤️</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            margin: 0; background: #000; 
            display: flex; align-items: center; justify-content: center; 
            min-height: 100vh; overflow: hidden; font-family: 'Segoe UI', sans-serif; 
        }

        /* 1. Mosaico VIVO (Fotos nítidas e claras) */
        .mosaico-container { position: absolute; width: 100%; height: 100%; overflow: hidden; }
        
        .spotlight {
            position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: conic-gradient(from 180deg at 50% 50%, transparent 45deg, rgba(255, 182, 193, 0.2) 90deg, transparent 135deg),
                        conic-gradient(from 0deg at 50% 50%, transparent 45deg, rgba(255, 215, 0, 0.2) 90deg, transparent 135deg);
            animation: rotateSpotlight 30s linear infinite; z-index: 2;
        }

        .mosaico {
            position: absolute; width: 100%; height: 100%;
            display: grid; grid-template-columns: repeat(auto-fill, minmax(20%, 1fr));
            opacity: 0.8; z-index: 1;
        }
        .mosaico img { 
            width: 100%; height: 100%; object-fit: cover; 
            filter: brightness(1.1) contrast(1.1);
            animation: kenBurns 18s infinite alternate ease-in-out;
        }
        
        @keyframes rotateSpotlight { to { transform: rotate(360deg); } }
        @keyframes kenBurns { from { transform: scale(1); } to { transform: scale(1.1); } }
        @media (max-width: 600px) { .mosaico { grid-template-columns: repeat(3, 1fr); } }

        .overlay { 
            position: absolute; width: 100%; height: 100%; 
            background: radial-gradient(circle, transparent 30%, rgba(0,0,0,0.6) 80%); 
            z-index: 3; 
        }

        /* 2. Conteúdo Central */
        .content { position: relative; z-index: 10; text-align: center; color: white; width: 100%; }

        .cake-container {
            position: relative; width: 200px; margin: 0 auto 30px;
            animation: levitate 3s infinite ease-in-out, pulse 1.5s infinite;
            filter: drop-shadow(0 0 20px rgba(255, 105, 180, 0.8));
        }

        .layer { display: block; background: #ff85a2; border-radius: 10px 10px 4px 4px; position: relative; margin: 0 auto; box-shadow: inset 0 -5px 0 rgba(0,0,0,0.1); }
        .layer-bottom { width: 160px; height: 60px; background: #f06292; }
        .layer-middle { width: 120px; height: 45px; background: #f48fb1; margin-top: -5px; }
        .layer-top { width: 80px; height: 35px; background: #f8bbd0; margin-top: -5px; }
        .layer::after { content: ""; position: absolute; top: 8px; left: 0; width: 100%; height: 12px; background: #ffffff; border-radius: 20px; opacity: 0.8; }

        .candle { width: 8px; height: 30px; background: repeating-linear-gradient(45deg, #fff, #fff 5px, #ff4d6d 5px, #ff4d6d 10px); margin: -25px auto 0; border-radius: 4px; position: relative; }
        .flame { width: 12px; height: 20px; background: #ff9800; border-radius: 50% 50% 20% 20%; position: absolute; top: -18px; left: -2px; animation: flicker 0.1s infinite alternate; box-shadow: 0 0 15px #ff9800; }

        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
        @keyframes flicker { from { transform: scale(1); } to { transform: scale(1.2); } }
        @keyframes levitate { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }

        #texto { 
            font-size: 22px; font-weight: bold; padding: 25px; 
            text-shadow: 2px 2px 10px rgba(0,0,0,1); 
            max-width: 800px; margin: 0 auto; line-height: 1.4;
            background: rgba(0, 0, 0, 0.45); border-radius: 20px;
            backdrop-filter: blur(3px);
        }

        /* 3. Animações de Festa */
        .particle { position: absolute; pointer-events: none; z-index: 5; animation: fallAndRotate linear forwards; }
        @keyframes fallAndRotate { 0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; } 100% { transform: translateY(110vh) rotate(720deg); opacity: 0; } }

        .confete { position: absolute; width: 10px; height: 10px; z-index: 15; animation: explode 2.5s ease-out forwards; }
        @keyframes explode { 0% { transform: translate(0,0) scale(1); opacity: 1; } 100% { transform: translate(var(--dx), var(--dy)) rotate(720deg) scale(0); opacity: 0; } }

        .magic-heart { 
            position: absolute; width: 15px; height: 15px; background: #ff69b4; 
            transform: rotate(-45deg); animation: orbitHeart 6s infinite linear; z-index: 9;
            box-shadow: 0 0 10px #ff69b4;
        }
        .magic-heart::after, .magic-heart::before { content: ''; position: absolute; width: 15px; height: 15px; background: #ff69b4; border-radius: 50%; }
        .magic-heart::after { top: -8px; left: 0; }
        .magic-heart::before { top: 0; left: 8px; }

        @keyframes orbitHeart { 
            0% { transform: rotate(0deg) translateX(110px) rotate(0deg); }
            100% { transform: rotate(360deg) translateX(110px) rotate(-360deg); }
        }
    </style>
</head>
<body>
    <div class="mosaico-container">
        <div class="spotlight"></div>
        <div class="mosaico" id="mosaico"></div>
    </div>
    <div class="overlay"></div>

    <div class="content">
        <div class="cake-container">
            <div class="candle"><div class="flame"></div></div>
            <div class="layer layer-top"></div>
            <div class="layer layer-middle"></div>
            <div class="layer layer-bottom"></div>
        </div>
        <div class="magic-heart" style="animation-delay: 0s; background: #ffd700;"></div>
        <div class="magic-heart" style="animation-delay: -2s; background: #ff69b4;"></div>
        <div class="magic-heart" style="animation-delay: -4s; background: #ffd700;"></div>
        <div id="texto"></div>
    </div>

    <script>
        const container = document.getElementById('mosaico');
        const fotos = [
            "PHOTO-2026-05-09-21-12-05.jpg", "PHOTO-2026-05-09-21-12-05 2.jpg",
            "PHOTO-2026-05-09-21-12-05 3.jpg", "PHOTO-2026-05-09-21-12-05 4.jpg",
            "PHOTO-2026-05-09-21-12-05 5.jpg", "PHOTO-2026-05-09-21-12-05 6.jpg",
            "PHOTO-2026-05-09-21-12-05 7.jpg", "PHOTO-2026-05-09-21-12-05 8.jpg",
            "PHOTO-2026-05-09-21-12-05 9.jpg", "PHOTO-2026-05-09-21-12-05 10.jpg",
            "PHOTO-2026-05-09-21-12-05 11.jpg", "PHOTO-2026-05-09-21-12-05 12.jpg",
            "PHOTO-2026-05-09-21-12-05 13.jpg", "PHOTO-2026-05-09-21-12-05 14.jpg",
            "PHOTO-2026-05-09-21-14-35.jpg", "PHOTO-2026-05-09-21-14-35 2.jpg",
            "PHOTO-2026-05-09-21-14-35 3.jpg", "PHOTO-2026-05-09-21-14-35 4.jpg",
            "PHOTO-2026-05-09-21-14-35 5.jpg", "PHOTO-2026-05-09-21-15-58.jpg",
            "PHOTO-2026-05-09-21-15-58 2.jpg"
        ];

        fotos.forEach(nome => {
            const img = document.createElement('img');
            img.src = nome;
            img.onerror = () => img.remove();
            container.appendChild(img);
        });

        const msg = "Feliz Aniversário, meu amor! ❤️\n\nNeste dia tão especial, quero que você se sinta muito amada, porque você é uma namorada maravilhosa e uma pessoinha incrível. Espero conseguir te fazer tão feliz quanto você me faz, porque eu me sinto a pessoa mais sortuda do mundo por ter você ao meu lado, meu amor. Queria conseguir fazer esse dia ainda mais especial para aproveitarmos cada segundo juntos, porque você merece o universo todinho, minha garotinha. 🫶🏼\n\nEu sei que talvez não esteja sendo exatamente do jeito que você queria, mas prometo que, nos próximos aniversários, vou dar o meu máximo para fazer tudo da melhor forma possível para a pessoa incrível que você é e que merece tanto.\n\nEu te amo muuuuuuuiiiiittooooo! ❤️🎂";
        
        let charIndex = 0;
        function escrever() {
            if (charIndex < msg.length) {
                document.getElementById('texto').innerHTML += msg.charAt(charIndex) === "\n" ? "<br>" : msg.charAt(charIndex);
                charIndex++;
                setTimeout(escrever, 50);
            } else {
                setInterval(() => soltarConfetes(Math.random()*100, Math.random()*100, 15), 3000);
            }
        }

        function soltarConfetes(x, y, qtd) {
            for (let i = 0; i < qtd; i++) {
                const c = document.createElement('div');
                c.classList.add('confete');
                c.style.backgroundColor = `hsl(${Math.random() * 360}, 100%, 75%)`;
                c.style.left = x + '%'; c.style.top = y + '%';
                c.style.setProperty('--dx', (Math.random() - 0.5) * 600 + 'px');
                c.style.setProperty('--dy', (Math.random() - 0.5) * 600 + 'px');
                document.body.appendChild(c);
                setTimeout(() => c.remove(), 2500);
            }
        }

        function createParticle() {
            const p = document.createElement('div');
            p.classList.add('particle');
            const icons = ['❤️', '✨', '💖', '🎈', '💕', '⭐', '🎉'];
            p.innerHTML = icons[Math.floor(Math.random() * icons.length)];
            p.style.left = Math.random() * 100 + 'vw';
            p.style.fontSize = Math.random() * 20 + 15 + 'px';
            p.style.animationDuration = (Math.random() * 3 + 4) + 's';
            if(['✨','⭐'].includes(p.innerHTML)) p.style.color = '#ffd700';
            document.body.appendChild(p);
            setTimeout(() => p.remove(), 7000);
        }

        window.onload = () => {
            escrever();
            soltarConfetes(50, 40, 70);
            setInterval(createParticle, 200);
        };
    </script>
</body>
</html>
